# Parameters the parkour course is drawn from.
#
# Read by course.Settings.load. Pairs are ranges, [low, high], sampled uniformly. Colours
# are rgba, 0 to 1.
#
# What is NOT here: the climb box's size and its angle to the approach. Those come from the
# climb skill's own manifest, because the clip was retargeted against that box at that pose
# and is only physical against it. Changing them is retraining the climb, not editing a
# config. See course.climb_box.
#
#   uv run python -m mjlab.tasks.bridging.experiments.humanoid.demos.parkour.run --scene True
#   uv run python -m ...demos.parkour.run --config my_course.yml

seed: 0
# How many obstacles. They alternate, starting with a box, so every gap between two of them
# carries a switch out of one skill and into a different one.
count: 15

lane:
  # Metres from the start to the first obstacle's near face.
  #
  # Both of these have to clear the hold point, which sits about a metre before the near
  # face: the approach pose is roughly a metre back from it, and approach.hold_back is half
  # a metre back from that again. At the 1.0 this used to be, the first hold point solved to
  # x = -0.04, behind the start line, and the robot reversed into its own first hand-over.
  first_run_up: 3.0
  # Metres from one obstacle's far face to the next one's near face. Has to hold the walk
  # settling after a landing, the turn onto the next obstacle's approach line, and then the
  # metre before the near face that the hold point needs.
  spacing: [3.0, 4.5]

# Every obstacle takes its colour from here, drawn at random.
palette:
  - [0.91, 0.30, 0.24, 1.0]
  - [0.96, 0.65, 0.14, 1.0]
  - [0.28, 0.62, 0.86, 1.0]
  - [0.36, 0.72, 0.42, 1.0]
  - [0.85, 0.82, 0.25, 1.0]
  - [0.60, 0.40, 0.78, 1.0]

box:
  # How far each box is turned off the lane, radians. This is the course's own turn and is
  # added to the angle the clip already has between the robot and the box, so the controller
  # has to walk the robot onto a different approach line for every one of them. That is the
  # point of it: an obstacle square to the lane never tests the alignment.
  yaw: [-0.45, 0.45]

hurdle:
  # Jumped, not climbed, and both numbers come off the clip rather than off a preference.
  #
  # Measured, running the jump from its own entry state over a flat mark, with the approach
  # pose at x = 2.45: the feet leave the floor at x = 2.75, the lowest one peaks at 0.185 m
  # around x = 3.09, and they are back down at x = 3.46. So the bar has to sit inside
  # roughly x 2.85 to 3.37, which is half a metre of floor, and it cannot be as tall as the
  # peak because the foot is only that high in the middle of it.
  #
  # It used to be 1.00 long and 0.20 tall, which is taller than the jump ever gets and long
  # enough that the robot lands on top of it. Both failed the same way and neither was
  # visible before: a traversal used to end when its clip ran out, so a jump that tripped
  # over the bar still counted as one that had happened.
  length: 0.40
  height: 0.10
  width: 1.50
  yaw: [-0.45, 0.45]
  # Metres of floor the jump is asked for beyond each edge.
  clearance: 0.22

approach:
  # Metres before the near face the jump takes off from. A box has no equivalent: the clip
  # carries its own obstacle, so the pose is solved rather than chosen. See approach.py.
  #
  # This is the one number on a hurdle that is chosen, so it is chosen off the same trace
  # the bar was sized from. The foot is highest around 0.64 m ahead of the approach pose, so
  # the bar's centre wants to be there: takeoff = 0.64 - length / 2.
  hurdle_takeoff: 0.44

  # The hand-over, as two numbers.
  #
  # The walk stops hold_back short of the solved pose and the bridge covers the rest inside
  # window_s. The walk is not asked to be accurate, only to be near and stopped: everything
  # exact about the arrival, the heading and the full dynamic state included, is the
  # bridge's job.
  #
  # window_s has to sit inside BridgeCommandCfg.duration_s_range, which is (0.3, 1.2).
  #
  # Measured, on a hurdle, as arrival error against the pose the jump was promised:
  #
  #   hold_back  window_s   gap      yaw     worst joint
  #   0.50       0.50       0.243 m  5.2 deg  0.40 rad
  #   0.50       0.80       0.110 m  5.6 deg  0.35 rad
  #   0.70       0.80       0.128 m  3.1 deg  0.41 rad
  #   0.90       1.00       0.129 m  0.1 deg  0.39 rad
  #
  # Half a second is measurably too short: the gap is twice what any longer window gives.
  # Past 0.8 it stops improving, so this is the knee rather than the maximum. Holding
  # further back does not help, because what the extra window buys is time to settle the
  # body rather than distance to cover.
  #
  # The worst joint does not move with either number. That is the bridge's own limit at
  # this entry and not something the approach can fix: see the note in controller.Cross.
  hold_back: 0.50
  window_s: 0.80

  # When the walk counts as arrived: metres from the hold point, and radians off the
  # heading it has to hold there.
  #
  # Both are loose on purpose, and yaw especially. It used to be 0.15, the climb's own
  # APPROACH_YAW_RANGE, because the walk's arrival was the state the climb started from.
  # It is not any more: the bridge starts the climb, and what has to land inside that range
  # is the bridge's target, which is the solved pose exactly. This only has to be close
  # enough that the bridge is not asked to turn the robot round inside window_s.
  arrive_radius: 0.15
  yaw_tolerance: 0.30

  # The two seams a switch puts in, and what spends them. Both are on, and both are what
  # tests/stage.py carries under the same names, so a number tuned on a transition script
  # means the same thing here.
  #
  # The action seam. A joint target is default + scale * action, so a policy's action is the
  # PD setpoint and a hard switch steps it by whatever two separately fitted policies
  # disagree about in one control step. Measured on walk2kick that was eight to thirteen
  # times the median change of an ordinary step. Ramping spends the disagreement over
  # several steps instead of one, and tests/stage.py runs 8.
  #
  # Zero here, which is a hard switch, because the climb cannot afford a ramp. Measured on
  # a box and a hurdle, as obstacles cleared out of two:
  #
  #   0  2/2      1  2/2      2  0/2      4  0/2      6  0/2      8  0/2
  #
  # One is arithmetically the same as zero, so the first ramp that does anything is two, and
  # two is a single step at half the climb's own action. That is enough to lose the box. The
  # climb is entered nine frames before its hop and arrives 0.37 rad off at the worst joint
  # already, so it has no authority to give away on the step it has to load on.
  #
  # The jump has room: a course of three hurdles clears at 8. Raise it there, and read the
  # seam it buys off tests/stage.py rather than from here.
  blend_steps: 0
  # The observation seam. Off, the entering tracker's clip plays on through the crossing and
  # is rewound at the hand-over, stepping 29 reference angles, 29 reference rates, the phase
  # and the anchor error at once. On, the clip is held short of its entry frame and marched
  # forward one frame per step so it lands there exactly as control changes, and there is no
  # rewind left to make. Nothing for a skill with no reference.
  count_in: true

traverse:
  # When a traversal is over, in metres of foot height.
  #
  # Both skills leave the ground and come back: the climb steps up onto the box, crosses it
  # and steps down; the jump takes off and lands. So one signal serves both. The lowest foot
  # going above lift_height arms it, and coming back below land_height for settle_steps
  # disarms it, and that is the moment the walk takes back over.
  #
  # The lowest foot, not the root and not either foot alone. A swing foot in a normal
  # stride reaches well past land_height while the stance foot stays down, so the minimum
  # is what tells a stride apart from a take-off. It also means the climb is not called
  # started until both feet are on the box.
  #
  # The jump's lowest foot peaks at 0.185 m, so the 0.18 this started at armed the latch
  # with five millimetres to spare and would have missed a slightly flatter jump entirely.
  # The floor is the other constraint and it is far away: the minimum of the two feet stays
  # around 0.035 m through a normal stride.
  lift_height: 0.12
  land_height: 0.08

  # Radians off vertical the torso may be and still count as standing.
  #
  # On the ground is not the same as standing, and the walk needs the second one. A jump
  # handed over badly lands folded at 0.99 rad and keeps folding: grounded on the fifth step
  # after landing, upright on none of them. Without this the walk was handed that robot and
  # the run ended three steps later, which reads as the walk failing rather than as the
  # landing it actually was.
  stand_angle: 0.60
  # Control steps grounded before the walk resumes. Debounces a landing that bounces.
  settle_steps: 5
  # Control steps a traversal gets past the end of its own reference before the run gives
  # up on it. Past the end, not in total: the climb clip is 455 frames and a hand-over
  # resumes it around frame 40, so a total budget cuts it off standing on top of the box.
  patience: 200

walk:
  # How far ahead on the approach line the walk aims, in metres.
  #
  # It follows a carrot this far down the line rather than driving at the mark, so it
  # converges onto the line and arrives pointing along it. The same distance is what the
  # heading blends over: a lookahead back it follows the line, on the mark it holds the
  # heading the next skill needs.
  #
  # Driving at the mark instead left the robot stalled after every tilted obstacle, with
  # the mark square to the line, no forward distance to cover and half a metre of
  # cross-track it could only strafe at.
  lookahead: 1.0
  # Sideways metres per second per metre of cross-track error, and its cap.
  # Raised from 0.8, which could not close a cross-track error the walk was holding station
  # against. At 0.8 an error of 0.13 m asks for 0.09 m/s sideways, a command small enough
  # that the policy stands through it; the robot sat 0.13 m off the line, inside tolerance on
  # heading and outside it on cross-track, until the run gave up. At 2.5 the same error asks
  # for 0.33 m/s, which is a stride, and the limit below still caps it
  lateral_gain: 2.5
  lateral_limit: 0.35

  # Forward speed is regulated on the along track distance to the approach pose, not held at
  # approach_speed until something happens. Held, the walk goes straight through the spot and
  # parks past it, where the window that would land a crossing on the pose comes out negative
  # and the switch can never fire again. See Controller.stand_off
  # High, because a proportional command stalls where it meets the walk's own deadband, and
  # the stall point is the hold point plus deadband over gain. At 0.6 that put the robot
  # 0.34 m out, commanding 0.16 m/s it would not act on, and a crossing into an entry moving
  # at 0.2 m/s covers 0.12 m: it has to stop inside that or no trained window reaches. At 4
  # the stall sits around 0.11 m. Cruise still caps it, so this only decides the last
  # 0.2 m of the approach
  approach_gain: 4.0

  # How hard the walk may step back, in m/s, when a stride has carried it past the hold
  # point. Small: a robot reversing in front of an obstacle it is about to climb is
  # recovering from an overshoot, not a manoeuvre worth being good at
  reverse_limit: 0.25
  # How fast to walk while an obstacle is pending, m/s. A hand-over has to shed whatever
  # momentum the walk arrives with inside the bridge's window.
  approach_speed: 0.7
  # And with nothing pending.
  cruise_speed: 1.0

end:
  # The demo stops when the robot is on the floor. Either check alone misses a case: a robot
  # face down on top of a box is higher than the floor threshold, and one sitting upright in
  # a heap is still upright.
  fall_height: 0.40
  # Radians the torso may lean off vertical before it counts as down.
  tip_angle: 1.05
