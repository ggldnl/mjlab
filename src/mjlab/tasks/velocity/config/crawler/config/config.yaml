# Reward weight search configuration for the Crawler velocity task.
#
# All fields are mandatory. The script will error immediately if any are missing.
#
# rewards:
#   Listed in descending order of expected importance. The ordering itself has
#   no effect on Optuna (TPE is order-agnostic), but it serves as documentation
#   of the shaping intent and makes diffs easier to read.
#
#   bounds: multiplier range applied to the default weight (e.g. [0.3, 4.0]
#           means Optuna can try weights from 0.3 to 4.0).
#
# metrics:
#   Listed in descending order of importance (highest weight first).
#   key: must match either one of the three built-in accumulator keys
#        (mean_reward, mean_ep_length, reward_std) or the exact name of
#        a MetricsTermCfg entry in cfg.metrics (e.g. mean_action_acc).
#   direction: "maximize" or "minimize"
#   weight: contribution to the composite score (can be negative to penalize)

trial_iterations: 1000       # how long each trial runs
report_interval: 50          # how often to report to pruner
n_trials: 40                 # total Optuna trials
study_name: crawler_velocity

# Rewards to tune, ordered by importance (descending).
# If omitted, it is kept fixed.
rewards:
  - name: track_linear_velocity
    group: task
    bounds: [0.5, 2.0]        # multiplier on the default weight
  - name: track_angular_velocity
    group: task
    bounds: [0.5, 2.0]
  - name: track_target_height
    group: task
    bounds: [0.5, 2.0]
  - name: upright
    group: stability
    bounds: [0.5, 1.0]
  - name: pose
    group: stability
    bounds: [0.5, 1.0]
  - name: air_time
    group: stability
    bounds: [0.5, 1.0]
  - name: action_rate_l2
    group: regularization
    bounds: [0.2, 0.5]

# Metrics to score each trial, ordered by importance.
# The script extracts whatever the runner logs.
metrics:
  - key: Episode/mean_reward       # exact key from the runner's log dict
    weight: 1.0
    direction: maximize
  - key: Episode/mean_ep_length
    weight: 0.4
    direction: maximize
  - key: Episode/rew_std           # penalize instability
    weight: -0.15
    direction: minimize